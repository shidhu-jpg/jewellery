<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout | Rajlaxmi Jewellers</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="container" style="max-width:980px">
    <div id="stepper"></div>

    <form id="addrForm" novalidate>
      <div class="checkout">
        <div>
          <h2>Delivery Address</h2>
          <div class="field"><label for="name">Full Name</label><input id="name" placeholder="Enter your full name" autocomplete="name" required><span class="msg">Please enter your full name</span></div>
          <div class="field"><label for="phone">Phone Number</label><input id="phone" type="tel" placeholder="Enter phone number" maxlength="10" pattern="[6-9][0-9]{9}" autocomplete="tel-national" required><span class="msg">Enter a valid 10-digit mobile number</span></div>
          <div class="field"><label for="pin">Pincode</label><input id="pin" placeholder="Enter pincode" maxlength="6" pattern="[1-9][0-9]{5}" inputmode="numeric" autocomplete="postal-code" required><span class="msg">Enter a valid 6-digit pincode</span></div>
          <div class="field"><label for="line">Address</label><input id="line" placeholder="House no., building, area" autocomplete="street-address" required><span class="msg">Please enter your address</span></div>
          <div class="field"><label for="city">City</label><input id="city" placeholder="Enter city" autocomplete="address-level2" required><span class="msg">Please enter your city</span></div>
          <div class="field"><label for="state">State</label><select id="state" required><option value="">Select state</option></select><span class="msg">Please select your state</span></div>
        </div>

        <div>
          <h2>Order Summary</h2>
          <div class="mini-list" id="mini"></div>
          <div id="sum"></div>
          <label class="default-addr"><input type="checkbox" id="saveAddr" checked> Use as default address</label>
        </div>
      </div>
      <button class="btn btn-primary btn-block checkout-cta">Continue to Payment</button>
    </form>
  </main>

  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    if (!Cart.selected().length) location.replace("cart.html");
    $("#stepper").innerHTML = stepper(1).replace('class="stepper"', 'class="stepper inline"');
    $("#state").innerHTML += ["Andhra Pradesh", "Assam", "Bihar", "Chhattisgarh", "Delhi", "Goa", "Gujarat", "Haryana", "Himachal Pradesh", "Jharkhand", "Karnataka", "Kerala", "Madhya Pradesh", "Maharashtra", "Odisha", "Punjab", "Rajasthan", "Tamil Nadu", "Telangana", "Uttar Pradesh", "Uttarakhand", "West Bengal"]
      .map((s) => `<option>${s}</option>`).join("");
    $("#mini").innerHTML = Cart.selected().map((it) => { const p = findProduct(it.id);
      return `<div class="mini-item"><img src="${p.img}" alt=""><div>${p.name}${it.qty > 1 ? ` × ${it.qty}` : ""}<b>${inr(linePrice(it))}</b></div></div>`; }).join("");
    $("#sum").innerHTML = priceLines();

    const saved = store.get("rj_addr", null);
    if (saved) ["name", "phone", "pin", "line", "city", "state"].forEach((k) => saved[k] && ($("#" + k).value = saved[k]));

    const form = $("#addrForm");
    form.addEventListener("input", (e) => e.target.closest(".field")?.classList.toggle("err", !e.target.checkValidity()));
    form.onsubmit = (e) => {
      e.preventDefault();
      const bad = $$("input[required], select[required]", form).filter((el) => !el.checkValidity());
      $$(".field", form).forEach((f) => f.classList.remove("err"));
      bad.forEach((el) => el.closest(".field").classList.add("err"));
      if (bad.length) { bad[0].focus(); return; }
      const addr = {};
      ["name", "phone", "pin", "line", "city", "state"].forEach((k) => (addr[k] = $("#" + k).value.trim()));
      store.set("rj_checkout_addr", addr);
      if ($("#saveAddr").checked) store.set("rj_addr", addr);
      location.href = "payment.html";
    };
  </script>
</body>
</html>
